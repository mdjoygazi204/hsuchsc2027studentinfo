  const list = document.getElementById("list");
  const search = document.getElementById("search");
  const groupSel = document.getElementById("group");
  const count = document.getElementById("count");
  const sortSel = document.getElementById("sort");
  // Prottek student er joma deoar kromo (list e jar nam age, se age submit koreche)
  students.forEach((s, i) => { s._order = i; });

  // Sort er pochondo mone rakhbe (default hishebe)
  try {
    const saved = localStorage.getItem("hsuc_sort");
    if (saved && [...sortSel.options].some(o => o.value === saved)) sortSel.value = saved;
  } catch (e) {}

  function render() {
    const q = search.value.trim().toLowerCase();
    const g = groupSel.value;
    const result = students.filter(s =>
      (!g || s.group === g) &&
      (!q || s.name.toLowerCase().includes(q) || String(s.roll).includes(q))
    );
    const mode = sortSel.value;
    const byName = (a, b) => a.name.localeCompare(b.name, "en", { sensitivity: "base" });
    result.sort((a, b) => {
      if (mode === "date-desc") return b._order - a._order;
      if (mode === "name-asc") return byName(a, b) || a._order - b._order;
      if (mode === "name-desc") return byName(b, a) || a._order - b._order;
      if (mode === "roll-asc") return (Number(a.roll) - Number(b.roll)) || a._order - b._order;
      return a._order - b._order;
    });
    count.textContent = result.length + " jon student paoa gelo";
    if (!result.length) {
      list.innerHTML = '<div class="empty">Kono student paoa jayni</div>';
      return;
    }
    list.innerHTML = result.map(s => `
      <div class="card">
        <div class="avatar">${s.name.charAt(0).toUpperCase()}<img src="${s.photo || ('photos/' + s.roll + '.jpg')}" alt="" loading="lazy" onerror="this.remove()"></div>
        <div class="name">${s.name}</div>
        <div class="meta">Roll: ${s.roll}${s.section ? "<br>Section: " + s.section : ""}</div>
        <span class="tag">${s.group}</span>
      </div>`).join("");
  }

  search.addEventListener("input", render);
  groupSel.addEventListener("change", render);
  sortSel.addEventListener("change", () => {
    try { localStorage.setItem("hsuc_sort", sortSel.value); } catch (e) {}
    render();
  });
  render();
</script>
</body>
</html>
