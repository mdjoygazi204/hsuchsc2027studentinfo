<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSUC HSC 2027 Student Info</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #6b7385;
    --accent: #2f5bea;
    --border: #e3e7f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --card: #1b1f29;
      --text: #e8ebf3;
      --muted: #9aa3b5;
      --accent: #6c8cff;
      --border: #2a3040;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 28px 16px;
    text-align: center;
  }
  header h1 { margin: 0 0 6px; font-size: 1.6rem; }
  header p { margin: 0; opacity: .9; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 8px 0 16px;
  }
  .controls input, .controls select {
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
  }
  .controls input { flex: 1 1 220px; }
  .count { color: var(--muted); margin-bottom: 12px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .avatar {
    width: 150px; height: 150px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 2.6rem;
    margin: 0 auto 14px;
    position: relative;
    overflow: hidden;
  }
  .avatar img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
  }
  .card { text-align: center; }
  .name { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: .92rem; line-height: 1.5; }
  .tag {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: .8rem;
  }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { text-align: center; color: var(--muted); padding: 24px 16px; font-size: .85rem; }
</style>
</head>
<body>

<header>

  const list = document.getElementById("list");
  const search = document.getElementById("search");
  const groupSel = document.getElementById("group");
  const count = document.getElementById("count");

  function render() {
    const q = search.value.trim().toLowerCase();
    const g = groupSel.value;
    const result = students.filter(s =>
      (!g || s.group === g) &&
      (!q || s.name.toLowerCase().includes(q) || String(s.roll).includes(q))
    );
    count.textContent = result.length + " jon student paoa gelo";
    if (!result.length) {
      list.innerHTML = '<div class="empty">Kono student paoa jayni</div>';
      return;
    }
    list.innerHTML = result.map(s => `
      <div class="card">
        <div class="avatar">${s.name.charAt(0).toUpperCase()}<img src="${s.photo || ('photos/' + s.roll + '.jpg')}" alt="" loading="lazy" onerror="this.remove()"></div>
        <div class="name">${s.name}</div>
        <div class="meta">Roll: ${s.roll}${s.section ? "<br>Section: " + s.section : ""}</div>
        <span class="tag">${s.group}</span>
      </div>`).join("");
  }

  search.addEventListener("input", render);
  groupSel.addEventListener("change", render);
  render();
</script>
